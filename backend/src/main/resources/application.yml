spring:
  application:
    name: helpagent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpagent}
    username: ${DB_USER:helpagent}
    password: ${DB_PASSWORD:helpagent}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é das migrations Flyway, nunca do Hibernate
    properties:
      hibernate:
        # a lista do histórico lê as linhas (fornecedores) de 20 orçamentos: em lote, 1 consulta em vez de 20
        default_batch_fetch_size: 50
  servlet:
    multipart:
      # Prints e PDFs de fornecedor são pequenos, mas o backup do histórico leva todos os PDFs em base64.
      max-file-size: 200MB
      max-request-size: 250MB
  # Com segurança habilitada, definir SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
  # (provedor corporativo ainda em decisão — docs/ESCOPO-E-PLANO-MIGRACAO.md §6).

server:
  port: ${PORT:8080}

# Integração (docs/INTEGRACAO.md): saúde com sondas liveness/readiness para o orquestrador, versão do build em
# /actuator/info e métricas Prometheus só quando ACTUATOR_EXPOR incluir "prometheus" (rede interna).
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOR:health,info}
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness e /readiness
      show-details: ${ACTUATOR_DETALHES:never}
  info:
    java:
      enabled: true

# Contrato da API gerado do código: /v3/api-docs (OpenAPI) e /swagger-ui.html. API_DOCS=false desliga.
springdoc:
  api-docs:
    enabled: ${API_DOCS:true}
  swagger-ui:
    enabled: ${API_DOCS:true}
  paths-to-match: /api/**

# Toda linha de log leva o id da requisição (X-Request-Id, IdRequisicaoFiltro): segue a chamada entre sistemas.
logging:
  pattern:
    level: "%5p [req=%X{req:-}]"

helpagent:
  fuso: America/Sao_Paulo
  # Liga/desliga por recurso (config/Recursos, docs/INTEGRACAO.md §5). A cotação precisa de um Chrome com janela:
  # num contêiner/servidor sem desktop, RECURSO_COTACAO=false. Desligado → 503 nas rotas e a tela esconde o recurso.
  recursos:
    ia: ${RECURSO_IA:true}
    cotacao: ${RECURSO_COTACAO:true}
  cors-origens: ${CORS_ORIGENS:http://localhost:4200}
  gemini:
    # Só no servidor. Nunca commitar; em produção vem de secret/cofre.
    api-key: ${GEMINI_API_KEY:}
    # Cadeia de fallback, do melhor para o pior (MANUTENCAO §4). Esgotou/sobrecarregou → desce um degrau; volta a
    # subir sozinho quando a pausa acaba. Limites = plano gratuito. O 20/dia do 3.6-flash veio do próprio 429 do
    # Google; os demais são ESTIMATIVA até conferir no painel https://aistudio.google.com/rate-limit (o Google não
    # publica nem devolve pela API). Quando o Google recusa com um limite menor, o servidor passa a usar o dele.
    # Conferido em 29/09/2026 com uma chamada mínima a cada um: o 2.5-flash-lite aparece na lista de modelos mas
    # responde 404 ("no longer available to new users") — ficou de fora; o 3.1-flash-lite entrou no lugar.
    cadeia:
      - { modelo: gemini-3.6-flash,      rpm: 5,  tpm: 250000, rpd: 20 }
      - { modelo: gemini-3.5-flash,      rpm: 5,  tpm: 250000, rpd: 20 }
      - { modelo: gemini-3.5-flash-lite, rpm: 10, tpm: 250000, rpd: 20 }
      - { modelo: gemini-3.1-flash-lite, rpm: 15, tpm: 250000, rpd: 500 }
      - { modelo: gemini-2.5-flash,      rpm: 10, tpm: 250000, rpd: 250 }
    modelo-forcado: ${GEMINI_MODELO_FORCADO:}
    max-tentativas: 3
    backoff: 1200ms
    # Anti-rajada: no máximo N leituras ao mesmo tempo; a próxima espera vaga. E um teto de requisições por leitura.
    max-simultaneas: 3
    espera-vaga: 45s
    max-chamadas-por-leitura: 4
    # Desempenho (ver docs/MANUTENCAO.md §4). Leitura normal: 5–12 s.
    timeout: 30s          # espera máxima por chamada; sobrecarregado, o Google já segurou 37 s até dar 503
    reserva-apos: 12s     # modelo da vez lento → dispara o degrau de baixo em paralelo (se tiver cota); vale a 1ª resposta
    nivel-raciocinio: low # thinkingLevel (3.x): minimal | low | medium | high; nos 2.x vira thinkingBudget
    cache-extracao: 30m   # mesmos arquivos de novo → resposta na hora, sem gastar quota (0 desliga)
  orcamento:
    max-itens: 10
    departamento: TECNOLOGIA
    variacao: 6%
    requerente-padrao: ANTONIO FELIPE
    gestor-padrao: GILSON PASSOS
  armazenamento:
    diretorio: ${ARMAZENAMENTO_DIR:./dados/arquivos}
  cotacao:
    canal: ${COTACAO_CANAL:chrome}   # chrome | msedge — navegador já instalado na máquina do backend
    perfil: ${COTACAO_PERFIL:./dados/navegador}
    max-paginas: 3
    cache-resultado: 30m
    janela-visivel: false            # true só para diagnosticar bloqueio/captcha (MANUTENCAO §7)
    prints: ${COTACAO_PRINTS:./dados/prints}  # prints das páginas de produto (orçamento por cotação)
    validade-prints: 7d              # print não usado em orçamento some depois disso
  seguranca:
    habilitada: ${SEGURANCA_HABILITADA:true}

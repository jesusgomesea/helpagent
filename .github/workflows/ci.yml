# CI: a cada push/PR, testa o backend, compila o frontend e confere que as duas imagens Docker montam
# (docs/INTEGRACAO.md §7). É o que garante, para quem integrar, que o main sempre sobe.
name: CI

on:
  push:
    branches: [main, homologacao]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL de verdade para o MigracoesPostgresTest (os demais testes usam H2)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: helpagent
          POSTGRES_USER: helpagent
          POSTGRES_PASSWORD: helpagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpagent" --health-interval 5s --health-retries 20
    env:
      # o Playwright só é usado na cotação, com o Chrome instalado; o CI não baixa navegador
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      TESTE_POSTGRES_URL: jdbc:postgresql://localhost:5432/helpagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # inclui AplicacaoSobeTest (tudo sobe num H2) e MigracoesPostgresTest (migrations no PostgreSQL)
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build

  imagens:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t helpagent-backend backend/
      - run: docker build -t helpagent-frontend frontend/
